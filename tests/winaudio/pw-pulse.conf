# Private pipewire-pulse of tests/winaudio/run.sh: the PulseAudio protocol (which Wine's
# winepulse speaks) on <private XDG_RUNTIME_DIR>/pulse/native, as a client of the private
# daemon of pw-null.conf. Streams get DSP ports so that run.sh can link them.
context.properties = {
    support.dbus = false
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse
        args = {
            server.address = [ "unix:native" ]
        }
    }
]
pulse.properties = {
    server.address = [ "unix:native" ]
}
stream.properties = {
    adapter.auto-port-config = { mode = dsp }
}
