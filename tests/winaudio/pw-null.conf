# Private PipeWire daemon of tests/winaudio/run.sh: two null sinks (stereo 48 kHz, the
# default; 5.1 at 44.1 kHz) and nothing else: no ALSA, no Bluetooth, no device monitors, no
# session manager (run.sh links the streams itself), no D-Bus. Its socket is in the private
# XDG_RUNTIME_DIR run.sh gives it, so no client of the user's sound server can see it.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 1024
    mem.allow-mlock = false
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
        }
    }
    # the null sinks; DSP ports so that their monitors can be linked and recorded
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = al-null-sink
            node.description = "AL null sink"
            media.class      = Audio/Sink
            object.linger    = true
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            priority.session = 1000
            priority.driver  = 1000
            monitor.channel-volumes = true
            adapter.auto-port-config = { mode = dsp monitor = true control = false position = preserve }
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = al-null-51
            node.description = "AL null 5.1"
            media.class      = Audio/Sink
            object.linger    = true
            audio.position   = [ FL FR FC LFE RL RR ]
            audio.rate       = 44100
            priority.session = 500
            priority.driver  = 500
            monitor.channel-volumes = true
            adapter.auto-port-config = { mode = dsp monitor = true control = false position = preserve }
        }
    }
]

